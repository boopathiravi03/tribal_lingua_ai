name: tribal_lingua_ai
description: AI powered vernacular pedagogy and real-time translation tool for mother tongue based primary education.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.5
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/audio/
    - assets/audio/santhali/
    - assets/fonts/NotoSansOlChiki-Regular.ttf
    - assets/fonts/NotoSansOlChiki-Bold.ttf
